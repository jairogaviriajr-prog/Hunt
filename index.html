<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scavenger Hunt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Family Scavenger Hunt</title>
<style>
:root{--ink:#1d1b3a;--mute:#6b6a85;--bg:#fff7e8;--card:#fff;--line:#ece3d0;--purple:#6c4cf1;--sun:#ffc233;--teal:#10b5a5;--pink:#ff5c8a;--red:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
h1,h2,h3{margin:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:10px;padding:0 20px}
.big{font-size:64px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;gap:10px}
.me{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:6px 12px 6px 8px;flex:1;text-align:left;min-width:0}
.av{font-size:30px;line-height:1;width:40px;height:40px;display:grid;place-items:center;flex:none}
.avimg{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.me .nm{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .sub{font-size:12px;color:var(--mute)}
.score{background:var(--ink);color:#fff;border-radius:18px;padding:8px 14px;font-weight:900;font-size:22px;min-width:76px;text-align:center}
.score small{display:block;font-size:10px;font-weight:700;opacity:.7;letter-spacing:.08em}
.banner{border-radius:14px;padding:9px 12px;font-size:13px;margin:4px 0 8px;background:#dff7f2;border:1px solid #9fe0d6}
.chips{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.prog{height:12px;background:#f0e6d0;border-radius:99px;overflow:hidden;margin:2px 0 12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--sun));border-radius:99px;transition:width .5s}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
button.card:active{transform:scale(.98)}
.card .ic{font-size:30px;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:#efeaff;flex:none;overflow:hidden}
.card .ic img{width:100%;height:100%;object-fit:cover}
.card.riddle .ic{background:#dff7f2}
.card .t{font-weight:800;font-size:16px;line-height:1.2}
.card .d{font-size:13px;color:var(--mute);margin-top:2px}
.pts{margin-left:auto;font-weight:900;color:var(--purple);background:#efeaff;border-radius:12px;padding:6px 10px;white-space:nowrap}
.card.done{background:#eefaf3;border-color:#bfe8cf}
.card.done .pts{background:#cdeedb;color:#16794a}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav .in{display:flex;gap:6px;width:100%;max-width:560px}
nav button{flex:1;background:none;border-radius:14px;padding:8px 2px;font-weight:800;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{background:#efeaff;color:var(--purple)}
.lb{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.lb.first{background:linear-gradient(135deg,#fff3c4,#ffe08a);border-color:#f5c542}
.lb.mine{outline:3px solid var(--purple)}
.lb .rk{font-size:26px;width:36px;text-align:center;font-weight:900}
.lb .av{font-size:34px;width:46px;height:46px}
.lb .who{flex:1;min-width:0}
.lb .who b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .who small{color:var(--mute)}
.lb .bar{height:8px;background:rgba(0,0,0,.08);border-radius:9px;margin-top:6px;overflow:hidden}
.lb .bar i{display:block;height:100%;background:var(--purple);border-radius:9px;transition:width .6s}
.lb .sc{font-size:26px;font-weight:900}
.btn{display:block;width:100%;background:var(--purple);color:#fff;border-radius:16px;padding:15px;font-weight:900;font-size:17px;margin-top:10px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:9px 12px;font-size:13px;margin:0;border-radius:12px}
.btn.red{background:var(--red);color:#fff}
.btn.on{border-color:var(--purple);background:#efeaff;color:var(--ink)}
input[type=text]{width:100%;font:inherit;font-size:20px;font-weight:700;padding:14px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.avs button{font-size:28px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 0}
.avs button.on{border-color:var(--purple);background:#efeaff}
.sec{font-weight:900;font-size:13px;letter-spacing:.08em;color:var(--mute);margin:18px 0 8px;text-transform:uppercase}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.pk{display:flex;gap:8px}
.pk button{flex:1;background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 6px;font-weight:800;font-size:14px}
.pk button.on{border-color:var(--purple);background:#efeaff}
.langs{display:flex;justify-content:flex-end;gap:6px;padding-top:calc(10px + env(safe-area-inset-top))}
.langs button{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.langs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.preview{display:flex;align-items:center;gap:12px;margin:10px 0}
.preview .av{width:64px;height:64px;font-size:46px;background:#fff;border:3px solid var(--line);border-radius:50%;overflow:hidden}
.qrbox{background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px;margin:8px auto;max-width:340px}
.qrbox svg{display:block;width:100%;height:auto}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{border-radius:14px;overflow:hidden;background:#fff;border:2px solid var(--line)}
.shot img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.shot small{display:block;padding:4px 6px;font-size:11px;color:var(--mute);line-height:1.2}
#modal{position:fixed;inset:0;z-index:20;display:none;background:rgba(29,27,58,.55);align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:21px;margin-bottom:6px}
.q{font-size:20px;font-weight:800;line-height:1.3;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px;font-size:18px;font-weight:800;margin-bottom:10px}
.opt.bad{border-color:var(--red);background:#ffecec;animation:shake .35s}
.opt.good{border-color:var(--teal);background:#dff7f2}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hint{background:#fff3c4;border-radius:14px;padding:10px 12px;font-size:15px;margin:4px 0 10px}
.mrow{display:flex;align-items:center;gap:8px;padding:10px;border:2px solid var(--line);border-radius:14px;margin-bottom:6px;width:100%;background:#fff;text-align:left}
.mrow.veto{opacity:.5;text-decoration:line-through;background:#ffecec}
#toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:30;background:var(--ink);color:#fff;font-weight:900;font-size:18px;padding:14px 22px;border-radius:20px;transition:transform .35s;text-align:center;max-width:90vw}
#toast.show{transform:translate(-50%,0)}
.muted{color:var(--mute);font-size:13px}
.tip{font-size:13px;color:var(--mute);margin:14px 0;line-height:1.4}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="fSel" accept="image/*" capture="user" hidden>
<input type="file" id="fLib" accept="image/*" hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fHost" accept="image/*" hidden>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];

function findMission(id){for(var k in PACKS){var m=PACKS[k].missions.filter(function(x){return x.id===id})[0];if(m)return m}return null}
function mtext(m){return m.l[LANG]||m.l.en}
function mtitle(m){return m.type==='riddle'?t('riddleTitle')+' #'+(m.id.replace(/\D/g,'')):mtext(m).t}
function mdesc(m){return m.type==='riddle'?t('solve'):mtext(m).d}

/* ---------- storage ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var KEY='hunt2',PKEY='hunt2_ph';
var D={pack:'park',me:'',profiles:{},imported:{},meta:{}};
var PH={};
(function(){try{var r=localStorage.getItem(KEY);if(r)D=Object.assign(D,JSON.parse(r))}catch(e){}try{var p=localStorage.getItem(PKEY);if(p)PH=JSON.parse(p)}catch(e){}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){return false}}
function savePh(){try{localStorage.setItem(PKEY,JSON.stringify(PH));return true}catch(e){return false}}
function setLang(l){LANG=l;try{localStorage.setItem('hunt2_lang',l)}catch(e){}document.documentElement.lang=l;document.title=t('title')}

var S={tab:'missions',filter:'all',screen:'',avatar:AVATARS[0],avPhoto:'',draft:'',skip:false,rm:null,riddle:null,pending:null,detail:null,reset:false,newPack:'park'};

/* ---------- scoring ---------- */
function entries(){
 var out=[],seen={};
 Object.keys(D.profiles).forEach(function(id){var p=D.profiles[id],d={};for(var k in p.done||{})d[k]=p.done[k].pts;seen[id]=1;out.push({id:id,name:p.name,emoji:p.emoji,photo:p.photo,pack:p.pack||D.pack,done:d,local:true})});
 Object.keys(D.imported).forEach(function(id){if(seen[id])return;var p=D.imported[id];out.push({id:id,name:p.name,emoji:p.emoji,photo:null,pack:p.pack,done:p.done||{},local:false})});
 return out;
}
function entScore(e){var m=D.meta[e.id]||{},s=0;for(var k in e.done){if(!(m.veto&&m.veto[k]))s+=e.done[k]}return s+(m.bonus||0)}
function entCount(e){var m=D.meta[e.id]||{},n=0;for(var k in e.done){if(!(m.veto&&m.veto[k]))n++}return n}
function entPhoto(e){var m=D.meta[e.id]||{};return m.photo||e.photo||''}
function ranked(){return entries().map(function(e){e.s=entScore(e);return e}).sort(function(a,b){return b.s-a.s||a.name.localeCompare(b.name)})}
function me(){return D.profiles[D.me]||null}
function avHtml(e){var ph=entPhoto(e);return ph?'<img class="avimg" alt="" src="'+esc(ph)+'">':esc(e.emoji||'🙂')}

/* ---------- rendering ---------- */
function toast(m){var el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show')},2400)}
function langs(){return '<div class="langs"><button data-act="lang" data-l="en" class="'+(LANG==='en'?'on':'')+'">English</button><button data-act="lang" data-l="es" class="'+(LANG==='es'?'on':'')+'">Español</button></div>'}
function render(){
 var a=$('#app'),ae=document.activeElement;
 if(ae&&ae.tagName==='INPUT'&&a.contains(ae))return;
 if(!me()&&!S.skip){a.innerHTML=setup();return}
 if(!me()&&S.tab==='missions')S.tab='board';
 var head=me()?headHtml():'<div class="top"><div class="me"><span class="av">🏆</span><span><div class="nm">'+esc(t('host'))+'</div></span></div></div>';
 var body=S.tab==='missions'?missions():S.tab==='share'?share():S.tab==='board'?board():settings();
 a.innerHTML=head+body+nav();
}
function setup(){
 var av=AVATARS.map(function(x){return '<button data-act="avatar" data-v="'+x+'" class="'+(x===S.avatar&&!S.avPhoto?'on':'')+'">'+x+'</button>'}).join('');
 var prev='<div class="preview"><div class="av">'+(S.avPhoto?'<img class="avimg" alt="" src="'+esc(S.avPhoto)+'">':esc(S.avatar))+'</div><div class="muted">'+esc(t('pickAnimal'))+' '+esc(t('orPhoto'))+'</div></div>';
 var pk=Object.keys(PACKS).map(function(k){return '<button data-act="newpack" data-k="'+k+'" class="'+(S.newPack===k?'on':'')+'">'+PACKS[k].emoji+'<br>'+esc(PACKS[k].name[LANG])+'</button>'}).join('');
 var skip=Object.keys(D.profiles).length||Object.keys(D.imported).length?'':'';
 return langs()+'<div style="padding:8px 0 20px"><h1>'+esc(t('setupTitle'))+'</h1><p class="muted">'+esc(t('setupSub'))+'</p><input id="nm" type="text" maxlength="14" placeholder="'+esc(t('namePh'))+'" value="'+esc(S.draft)+'" autocomplete="off">'+prev+'<div class="avs">'+av+'</div><div class="row2"><button class="btn alt sm" data-act="selfie">'+esc(t('selfie'))+'</button><button class="btn alt sm" data-act="lib">'+esc(t('choosePhoto'))+'</button></div><div class="sec">'+esc(t('whichHunt'))+'</div><div class="pk">'+pk+'</div><button class="btn" data-act="create">'+esc(t('go'))+'</button><button class="btn alt" data-act="skip">'+esc(t('keepScore'))+'</button></div>';
}
function headHtml(){
 var p=me(),e={id:D.me,name:p.name,emoji:p.emoji,photo:p.photo,done:{}};for(var k in p.done||{})e.done[k]=p.done[k].pts;
 var pk=PACKS[p.pack||D.pack]||PACKS.park;
 return '<div class="top"><button class="me" data-act="tab" data-t="settings"><span class="av">'+avHtml(e)+'</span><span style="min-width:0"><div class="nm">'+esc(p.name)+'</div><div class="sub">'+pk.emoji+' '+esc(pk.name[LANG])+'</div></span></button><div class="score"><small>'+esc(t('points'))+'</small>'+entScore(e)+'</div></div>';
}
function nav(){
 function b(k,i,l){return '<button data-act="tab" data-t="'+k+'" class="'+(S.tab===k?'on':'')+'"><span>'+i+'</span>'+esc(t(l))+'</button>'}
 return '<nav><div class="in">'+(me()?b('missions','🧭','tabMissions')+b('share','📱','tabShare'):'')+b('board','🏆','tabBoard')+b('settings','⚙️','tabSettings')+'</div></nav>';
}
function curPack(){var p=me();return PACKS[(p&&p.pack)||D.pack]||PACKS.park}
function missions(){
 var p=me(),list=curPack().missions,d=p.done||{},n=list.filter(function(m){return d[m.id]}).length,f=S.filter;
 var chips=[['all','fAll'],['photo','fPhoto'],['riddle','fRiddle']].map(function(c){return '<button class="chip '+(f===c[0]?'on':'')+'" data-act="filter" data-f="'+c[0]+'">'+esc(t(c[1]))+'</button>'}).join('');
 var cards=list.filter(function(m){return f==='all'||m.type===f}).map(function(m){
  var st=d[m.id],ph=PH[D.me+'_'+m.id];
  var ic=ph?'<img alt="" src="'+esc(ph)+'">':(m.type==='photo'?'📸':'🧩');
  return '<button class="card '+m.type+(st?' done':'')+'" data-act="mission" data-id="'+m.id+'"'+(st?' disabled':'')+'><span class="ic">'+ic+'</span><span><div class="t">'+esc(mtitle(m))+'</div><div class="d">'+esc(mdesc(m))+'</div></span><span class="pts">'+(st?'✅ +'+st.pts:m.pts)+'</span></button>';
 }).join('');
 return '<div class="muted" style="margin-top:4px">'+esc(t('mDone',{n:n,t:list.length}))+'</div><div class="prog"><i style="width:'+Math.round(n/list.length*100)+'%"></i></div><div class="chips">'+chips+'</div>'+cards+'<div class="tip">'+esc(t('safety'))+'</div>';
}
function payload(){
 var p=me(),d=[];for(var k in p.done||{})d.push([k,p.done[k].pts]);
 var o={v:1,i:D.me,n:p.name,e:p.emoji,k:p.pack||D.pack,d:d};
 var s=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 var base=location.href.split('#')[0];
 return base+'#s='+s;
}
function qrSvg(text){
 try{
  var q=qrcode(0,'M');q.addData(text);q.make();
  var n=q.getModuleCount(),m=4,sz=n+2*m,path='';
  for(var r=0;r<n;r++){var run=-1;for(var c=0;c<=n;c++){var dark=c<n&&q.isDark(r,c);if(dark&&run<0)run=c;if(!dark&&run>=0){path+='M'+(run+m)+' '+(r+m)+'h'+(c-run)+'v1h-'+(c-run)+'z';run=-1}}}
  return '<svg viewBox="0 0 '+sz+' '+sz+'" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="'+sz+'" height="'+sz+'" fill="#fff"/><path d="'+path+'" fill="#000"/></svg>';
 }catch(e){return '<p class="muted">QR error</p>'}
}
function share(){
 var p=me();if(!p)return '<div class="center"><div class="big">🧭</div><p>'+esc(t('noProfile'))+'</p></div>';
 var shots=Object.keys(p.done||{}).filter(function(k){return PH[D.me+'_'+k]}).map(function(k){var m=findMission(k);return '<div class="shot"><img alt="" src="'+esc(PH[D.me+'_'+k])+'"><small>'+esc(m?mtext(m).t:k)+'</small></div>'}).join('');
 return '<h2 style="margin:10px 0 2px">'+esc(t('shareTitle'))+'</h2><p class="muted" style="margin-top:0">'+esc(t('shareHow'))+'</p><div class="qrbox">'+qrSvg(payload())+'</div><div class="sec">'+esc(t('myPhotos'))+'</div>'+(shots?'<div class="shots">'+shots+'</div>':'<p class="muted">'+esc(t('noPhotos'))+'</p>');
}

 var rows=ranked();
 if(!rows.length)return '<div class="center"><div class="big">🏆</div><p>'+esc(t('boardEmpty'))+'</p></div>';
 var top=Math.max(rows[0].s,1),medal=['🥇','🥈','🥉'];
 return '<h2 style="margin:10px 0">'+esc(t('boardTitle'))+'</h2>'+rows.map(function(r,i){
  return '<button class="lb '+(i===0&&r.s>0?'first ':'')+(r.id===D.me?'mine':'')+'" data-act="detail" data-id="'+esc(r.id)+'"><div class="rk">'+(medal[i]||(i+1))+'</div><div class="av">'+avHtml(r)+'</div><div class="who"><b>'+esc(r.name)+'</b><small>'+esc(t('nMissions',{n:entCount(r)}))+'</small><div class="bar"><i style="width:'+Math.round(r.s/top*100)+'%"></i></div></div><div class="sc">'+r.s+'</div></button>';
 }).join('');
}
function settings(){
 var pk=Object.keys(PACKS).map(function(k){var cur=(me()&&me().pack)||D.pack;return '<button data-act="pack" data-k="'+k+'" class="'+(cur===k?'on':'')+'">'+PACKS[k].emoji+'<br>'+esc(PACKS[k].name[LANG])+'</button>'}).join('');
 var pl=Object.keys(D.profiles).map(function(id){var p=D.profiles[id];return '<button class="card" data-act="pick" data-id="'+esc(id)+'" style="padding:10px"><span class="av">'+avHtml({id:id,emoji:p.emoji,photo:p.photo})+'</span><span class="t">'+esc(p.name)+'</span>'+(id===D.me?'<span class="pts">✓</span>':'')+'</button>'}).join('');
 return '<div class="sec">'+esc(t('language'))+'</div><div class="row2"><button class="btn alt sm '+(LANG==='en'?'on':'')+'" data-act="lang" data-l="en">English</button><button class="btn alt sm '+(LANG==='es'?'on':'')+'" data-act="lang" data-l="es">Español</button></div>'+
  (me()?'<div class="sec">'+esc(t('hunt'))+'</div><div class="pk">'+pk+'</div>':'')+
  '<div class="sec">'+esc(t('players'))+'</div>'+pl+'<button class="btn alt" data-act="newPlayer">'+esc(t('newPlayer'))+'</button>'+(me()?'<button class="btn alt" data-act="changePic">'+esc(t('changePic'))+'</button>':'')+
  '<div class="sec">'+esc(t('host'))+'</div><p class="muted">'+esc(t('hostTip'))+'</p><p class="muted">'+esc(t('offline'))+'</p><button class="btn alt red" data-act="reset" style="color:#e5484d">'+esc(S.reset?t('resetConfirm'):t('resetAll'))+'</button>';
}

/* ---------- modal ---------- */
function openModal(h){var m=$('#modal');m.innerHTML='<div class="sheet">'+h+'</div>';m.className='show'}
function closeModal(){var m=$('#modal');m.className='';m.innerHTML='';S.riddle=null;S.detail=null}
function riddleHtml(){
 var r=S.riddle,x=r.m.l[LANG]||r.m.l.en;
 var opts=x.o.map(function(o,i){return '<button class="opt'+(r.bad.indexOf(i)>=0?' bad':'')+'" data-act="ans" data-i="'+i+'">'+esc(o)+'</button>'}).join('');
 return '<h2>'+esc(t('riddleH'))+' <span class="pts" style="float:right">'+r.pts()+'</span></h2><div class="q">'+esc(x.q)+'</div>'+opts+(r.hint?'<div class="hint">💡 '+esc(x.h)+'</div>':'<button class="btn alt sm" data-act="hint">'+esc(t('hintBtn'))+'</button>')+'<button class="btn alt" data-act="close">'+esc(t('close'))+'</button>';
}
function detailHtml(){
 var e=entries().filter(function(x){return x.id===S.detail})[0];if(!e){closeModal();return}
 var m=D.meta[e.id]||{},v=m.veto||{};
 var list=Object.keys(e.done).map(function(k){var mm=findMission(k),ph=PH[e.id+'_'+k];return '<button class="mrow '+(v[k]?'veto':'')+'" data-act="veto" data-m="'+esc(k)+'">'+(ph?'<img alt="" src="'+esc(ph)+'" style="width:40px;height:40px;border-radius:8px;object-fit:cover">':'')+'<span style="flex:1">'+esc(mm?mtitle(mm)+(mm.type==='photo'?'':' ('+k+')'):k)+'</span><b>+'+e.done[k]+'</b></button>'}).join('');
 return '<div style="display:flex;align-items:center;gap:10px"><div class="av" style="font-size:40px;width:56px;height:56px">'+avHtml(e)+'</div><div style="flex:1"><h2 style="margin:0">'+esc(e.name)+'</h2><div class="muted">'+esc(entScore(e))+' '+esc(t('points').toLowerCase())+'</div></div></div>'+
 '<div class="sec">'+esc(t('vetoNote'))+'</div>'+(list||'')+
 '<div class="row2" style="margin-top:10px"><button class="btn sm" data-act="bonus">'+esc(t('bonus'))+(m.bonus?' ('+m.bonus+')':'')+'</button><button class="btn alt sm" data-act="hostPhoto">'+esc(t('addPhoto'))+'</button><button class="btn alt sm" data-act="rm">'+esc(S.rm===e.id?t('removeConfirm'):t('remove'))+'</button></div><button class="btn alt" data-act="close">'+esc(t('done'))+'</button>';
}

/* ---------- actions ---------- */
function unfocus(){var e=document.activeElement;if(e&&e.tagName==='INPUT')e.blur()}
function keepDraft(){var n=$('#nm');if(n)S.draft=n.value}
var A={
 lang:function(d){keepDraft();setLang(d.l);render()},
 avatar:function(d){keepDraft();S.avatar=d.v;S.avPhoto='';render()},
 newpack:function(d){keepDraft();S.newPack=d.k;render()},
 selfie:function(){keepDraft();S.target='avatar';var f=$('#fSel');f.value='';f.click()},
 lib:function(){keepDraft();S.target='avatar';var f=$('#fLib');f.value='';f.click()},
 skip:function(){S.skip=true;S.tab='board';render()},
 create:function(){
  var name=(($('#nm')||{}).value||'').trim().slice(0,14);if(!name){toast(t('needName'));return}
  unfocus();
  var id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  D.profiles[id]={name:name,emoji:S.avatar,photo:S.avPhoto||'',pack:S.newPack,done:{}};D.me=id;D.pack=S.newPack;
  S.draft='';S.avPhoto='';S.screen='';S.skip=false;S.tab='missions';save();render();
 },
 newPlayer:function(){D.me='';S.skip=false;S.draft='';S.avPhoto='';S.avatar=AVATARS[0];S.newPack=D.pack;render()},
 pick:function(d){D.me=d.id;save();S.tab='missions';render()},
 tab:function(d){S.tab=d.t;S.reset=false;render();window.scrollTo(0,0)},
 filter:function(d){S.filter=d.f;render()},
 pack:function(d){var p=me();if(p){p.pack=d.k}D.pack=d.k;save();render()},
 changePic:function(){S.target='mine';var f=$('#fLib');f.value='';f.click()},
 reset:function(){if(S.reset){D={pack:D.pack,me:'',profiles:{},imported:{},meta:{}};PH={};save();savePh();S.reset=false;S.skip=false;S.tab='missions';render()}else{S.reset=true;render()}},
 mission:function(d){
  var m=findMission(d.id);if(!m||!me())return;
  if(m.type==='photo'){S.pending=m;var f=$('#fCam');f.value='';f.click();return}
  S.riddle={m:m,bad:[],hint:false,pts:function(){return Math.max(2,m.pts-3*this.bad.length-(this.hint?2:0))}};
  openModal(riddleHtml());
 },
 hint:function(){S.riddle.hint=true;openModal(riddleHtml())},
 ans:function(d){
  var r=S.riddle;if(!r)return;var i=+d.i,p=me();
  if(i===r.m.a){
   var pts=r.pts(),m=r.m;var b=document.querySelectorAll('.opt')[i];if(b)b.classList.add('good');
   p.done[m.id]={pts:pts,type:'riddle',ts:Date.now()};save();
   setTimeout(function(){closeModal();toast(t('correct',{n:pts}));render()},650);
  }else{if(r.bad.indexOf(i)<0)r.bad.push(i);openModal(riddleHtml())}
 },
 close:function(){closeModal();render()},
 detail:function(d){S.detail=d.id;S.rm=null;openModal(detailHtml())},
 veto:function(d){var id=S.detail,m=D.meta[id]=D.meta[id]||{};m.veto=m.veto||{};if(m.veto[d.m])delete m.veto[d.m];else m.veto[d.m]=1;save();openModal(detailHtml());render()},
 bonus:function(){var id=S.detail,m=D.meta[id]=D.meta[id]||{};m.bonus=(m.bonus||0)+5;save();openModal(detailHtml());render();toast('⭐ +5')},
 hostPhoto:function(){S.target='host';var f=$('#fHost');f.value='';f.click()},
 rm:function(){var id=S.detail;if(S.rm===id){S.rm=null;delete D.imported[id];delete D.profiles[id];delete D.meta[id];if(D.me===id)D.me='';save();closeModal();render()}else{S.rm=id;openModal(detailHtml())}}
};
document.addEventListener('click',function(e){var tg=e.target.closest('[data-act]');if(!tg||tg.disabled)return;var f=A[tg.getAttribute('data-act')];if(f)f(tg.dataset,e)});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='nm')A.create()});

/* ---------- photos ---------- */
function shrink(file,max,q,square){
 return new Promise(function(res,rej){
  var fr=new FileReader();fr.onerror=function(){rej()};
  fr.onload=function(){var im=new Image();im.onerror=function(){rej()};
   im.onload=function(){
    var w=im.width,h=im.height,c=document.createElement('canvas'),g=c.getContext('2d');
    if(square){var s=Math.min(w,h);c.width=c.height=max;g.drawImage(im,(w-s)/2,(h-s)/2,s,s,0,0,max,max)}
    else{var k=Math.min(1,max/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k);g.drawImage(im,0,0,c.width,c.height)}
    res(c.toDataURL('image/jpeg',q));
   };im.src=fr.result};
  fr.readAsDataURL(file);
 });
}
function onAvatarFile(){
 var f=this.files&&this.files[0];if(!f)return;var target=S.target;
 shrink(f,128,0.75,true).then(function(img){
  if(target==='avatar'){S.avPhoto=img;render()}
  else if(target==='mine'&&me()){me().photo=img;if(!save())toast(t('storageFull'));render()}
 }).catch(function(){toast(t('photoFail'))});
}
$('#fSel').addEventListener('change',onAvatarFile);
$('#fLib').addEventListener('change',onAvatarFile);
$('#fHost').addEventListener('change',function(){
 var f=this.files&&this.files[0],id=S.detail;if(!f||!id)return;
 shrink(f,128,0.75,true).then(function(img){var m=D.meta[id]=D.meta[id]||{};m.photo=img;save();openModal(detailHtml());render()}).catch(function(){toast(t('photoFail'))});
});
$('#fCam').addEventListener('change',function(){
 var f=this.files&&this.files[0],m=S.pending,p=me();if(!f||!m||!p)return;S.pending=null;toast(t('sending'));
 shrink(f,420,0.6,false).then(function(img){
  p.done[m.id]={pts:m.pts,type:'photo',ts:Date.now()};PH[D.me+'_'+m.id]=img;
  var ok=save();if(!savePh()){delete PH[D.me+'_'+m.id];toast(t('storageFull'))}else if(ok)toast(t('photoOk',{n:m.pts}));
  render();
 }).catch(function(){toast(t('photoFail'))});
});

/* ---------- importing a scanned score ---------- */
function importHash(){
 var h=location.hash;if(h.indexOf('#s=')!==0)return;
 var clean=function(){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};
 try{
  var b=h.slice(3).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  var o=JSON.parse(decodeURIComponent(escape(atob(b))));
  var id=String(o.i||'').replace(/[^\w-]/g,'').slice(0,24);if(!id)throw 0;
  clean();
  if(D.profiles[id]){toast(t('importSelf'));return}
  var done={};(Array.isArray(o.d)?o.d:[]).slice(0,80).forEach(function(x){
   var mid=String(x[0]||'').replace(/[^\w]/g,'').slice(0,12),m=findMission(mid);if(!m)return;
   var pts=parseInt(x[1],10);if(!(pts>=0))return;done[mid]=Math.min(pts,m.pts)});
  var ent={name:String(o.n||'?').slice(0,14),emoji:String(o.e||'🙂').slice(0,8),pack:PACKS[o.k]?o.k:'park',done:done,ts:Date.now()};
  D.imported[id]=ent;save();S.skip=true;S.tab='board';
  var sc=entScore({id:id,done:done});toast(t('imported',{n:ent.name,p:sc}));
 }catch(e){clean();toast(t('importBad'))}
}

/* ---------- start ---------- */
setLang(LANG);
S.skip=Object.keys(D.imported).length>0;
importHash();
window.addEventListener('hashchange',function(){importHash();render()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
